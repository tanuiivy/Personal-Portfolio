<body>
  <div class="page page--full">
    <header>
      <nav class="site-nav" aria-label="Main">
        <a class="logo" data-cur="1" href="index.html" aria-label="Ivy, home"><span>I</span>VY</a>
        <ul class="nav-links">

        <span></span>
      </nav>
    </header>

    <main class="contact">
      <div class="contact__intro">
        <h1 class="contact__title">
          <span>Let's</span>
          <button type="button" class="text-btn contact__word" data-cur="1" aria-label="Change word">Talk.</button>
        </h1>
        <div class="contact__lede">
          <span class="status"><span class="status__dot"></span>OPEN TO WORK · 2026</span>
          <p>Hiring for a role, starting a project, or just after a good book rec? Send me an email. I reply to every one.</p>
        </div>
      </div>

      <div class="contact__links">
        <button type="button" class="email-card" data-cur="1" data-email="ivycherop0@gmail.com">
          <span class="email-card__top"><span>EMAIL ME</span><span class="email-card__hint">CLICK TO COPY</span></span>
          <span class="email-card__address" aria-live="polite">ivycherop0@gmail.com</span>
        </button>

        <div class="social-cards">
          <a class="social-card" data-cur="1" href="https://github.com/tanuiivy" target="_blank" rel="noopener" style="--tint:#E0F4F5;--accent:#0098A6">
            <span class="social-card__top"><span>GITHUB</span><span class="icon-dot">↗</span></span>
            <span class="social-card__name">@tanuiivy</span>
          </a>
          <a class="social-card" data-cur="1" href="https://www.linkedin.com/in/ivy-tanui" target="_blank" rel="noopener" style="--tint:#FCE8F1;--accent:#E0368A">
            <span class="social-card__top"><span>LINKEDIN</span><span class="icon-dot">↗</span></span>
            <span class="social-card__name">Ivy Tanui</span>
          </a>
        </div>

        <a class="cv-card" data-cur="1" href="assets/docs/Ivy-Tanui-CV.pdf" download="Ivy-Tanui-CV.pdf">
          <span class="cv-card__text"><span class="cv-card__label">CV · PDF</span><span class="cv-card__title">Download my CV</span></span>
          <span class="icon-dot" style="--accent:#7B5CFF">↓</span>
        </a>
      </div>
    </main>

    <footer class="site-footer site-footer--bare">
      <div class="footer-bar">
        <ul class="social">
          <li><a data-cur="1" href="https://github.com/tanuiivy" target="_blank" rel="noopener">GitHub ↗</a></li>
          <li><a data-cur="1" href="https://www.linkedin.com/in/ivy-tanui" target="_blank" rel="noopener">LinkedIn ↗</a></li>
        </ul>
        <span class="scratch" data-scratch="1">psst, type "party" or "ivy"</span>
      </div>
    </footer>

    <div class="cursor" aria-hidden="true"><img src="assets/images/fuzzy-cursor.png" alt=""></div>
